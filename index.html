    * {

    }

    body {
      background-color: #0b0506;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: #15090b;
      border: 1px solid #331014;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 700;
    }

    p {
      color: #b5a0a3;
      font-size: 0.95rem;
      margin-bottom: 28px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: all 0.2s ease-in-out;
      cursor: pointer;
    }

    /* Botão Principal em Vermelho Escuro */
    .btn-primary {
      background: linear-gradient(135deg, #a3080c, #5c0003);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(163, 8, 12, 0.4);
      border: 1px solid #c40a0f;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #b8090e, #730004);
      box-shadow: 0 6px 20px rgba(163, 8, 12, 0.6);
    }

    /* Botões Secundários */
    .btn-secondary {
      background-color: #1f0d10;
      color: #e1e4ed;
      border: 1px solid #3d1419;
    }

    .btn-secondary:hover {
      background-color: #2b1216;
      transform: translateY(-2px);
      color: #ffffff;
    }

    .footer-note {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #7e6366;
    }
  </style>
</head>
